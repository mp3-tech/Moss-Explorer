<!DOCTYPE html>
<html lang="zh-TW">
<head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>投稿倒數計時器 - AI 蘚苔探險家</title> <link rel="stylesheet" href="css/style.css">
</head>
<body> <div id="navbar-placeholder"></div> <div class="container countdown-page"> <nav class="breadcrumb"><a href="index.html">首頁</a> &gt; <a href="tools.html">研究工具箱</a> &gt; <span>投稿倒數計時器</span></nav> <div class="page-header"> <h1> 投稿倒數計時器 (Countdown)</h1> <p>做研究最怕趕死線！設定好你的目標日，讓時間成為你最強的督導。</p> </div> <div class="countdown-layout"> <div class="card settings-panel"> <h3 class="section-title"> 設定截稿目標</h3> <p class="text-muted" style="font-size: 0.9rem; margin-bottom: 20px;"> 請輸入你們預計參加的競賽截稿日期。設定完成後，首頁的儀表板也會同步更新喔！
                </p> <div class="input-group"> <label for="date-science">全國中小學科學展覽會 (校內初選/全國賽)</label> <input type="datetime-local" id="date-science" value="2026-09-01T23:59"> </div> <div class="input-group"> <label for="date-essay">中學生網站小論文投稿 (梯次截止日)</label> <input type="datetime-local" id="date-essay" value="2026-10-15T12:00"> </div> <button class="btn btn-primary" id="btn-save-dates" style="width: 100%; margin-top: 10px;"> 儲存設定</button> <div id="save-msg" style="color: var(--primary); font-size: 0.85rem; margin-top: 10px; text-align: center; display: none;"> 設定已成功儲存！
                </div> </div> <div class="display-panel"> <div class="card timer-card"> <h3 style="margin: 0 0 15px 0; color: #1565c0;"> 科學展覽會 剩餘時間</h3> <div class="huge-timer" id="page-timer-science"> --<span>天</span>--<span>時</span>--<span>分</span>--<span>秒</span> </div> </div> <div class="card timer-card" style="margin-top: 24px;"> <h3 style="margin: 0 0 15px 0; color: #ef6c00;"> 中學生小論文 剩餘時間</h3> <div class="huge-timer" id="page-timer-essay"> --<span>天</span>--<span>時</span>--<span>分</span>--<span>秒</span> </div> </div> </div> </div> </div> <script src="js/main.js"></script> <script> document.addEventListener("DOMContentLoaded", function() {
            const inputScience = document.getElementById("date-science");
            const inputEssay = document.getElementById("date-essay");
            const btnSave = document.getElementById("btn-save-dates");
            const saveMsg = document.getElementById("save-msg");
            
            const timerScience = document.getElementById("page-timer-science");
            const timerEssay = document.getElementById("page-timer-essay");

            // 1. 讀取 localStorage 中已儲存的日期（如果有）
            const savedScience = localStorage.getItem("targetDateScience");
            const savedEssay = localStorage.getItem("targetDateEssay");

            if (savedScience) inputScience.value = savedScience;
            if (savedEssay) inputEssay.value = savedEssay;

            // 2. 儲存按鈕點擊事件
            btnSave.addEventListener("click", function() {
                localStorage.setItem("targetDateScience", inputScience.value);
                localStorage.setItem("targetDateEssay", inputEssay.value);
                
                saveMsg.style.display = "block";
                setTimeout(() => { saveMsg.style.display = "none"; }, 2000);
            });

            // 3. 大型倒數計時器更新邏輯
            function updatePageCountdowns() {
                const now = new Date().getTime();
                
                const sciDate = new Date(inputScience.value).getTime();
                const essDate = new Date(inputEssay.value).getTime();

                function formatTime(distance) {
                    if (isNaN(distance) || distance < 0) return "<span style='color: #d32f2f;'>時間已截止或未設定</span>";
                    
                    const days = Math.floor(distance / (1000 * 60 * 60 * 24));
                    const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                    const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                    const seconds = Math.floor((distance % (1000 * 60)) / 1000);
                    
                    const hrStr = hours.toString().padStart(2, '0');
                    const minStr = minutes.toString().padStart(2, '0');
                    const secStr = seconds.toString().padStart(2, '0');

                    return `${days}<span>天</span>${hrStr}<span>時</span>${minStr}<span>分</span>${secStr}<span>秒</span>`;
                }

                timerScience.innerHTML = formatTime(sciDate - now);
                timerEssay.innerHTML = formatTime(essDate - now);
            }

            updatePageCountdowns();
            setInterval(updatePageCountdowns, 1000);
        });
    </script>
</body>
</html>
