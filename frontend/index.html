<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 蘚苔探險家</title>
    <style>
        /* 全域變數與重置 */
        :root {
            --primary-color: #2e7d32;
            --secondary-color: #4caf50;
            --bg-color: #f1f8e9;
            --card-bg: #ffffff;
            --text-main: #333333;
            --text-muted: #666666;
            --top-bar-bg: #1a1a1a;
            --bottom-bar-bg: #222222;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            padding-bottom: 60px; /* 預留底部控制列的空間 */
            line-height: 1.6;
        }

        a { text-decoration: none; color: inherit; }

        /* 頂部狀態列 (對應設計圖最上方) */
        .status-bar {
            background-color: var(--top-bar-bg);
            color: #eeeeee;
            padding: 0.5rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
        }

        .status-stats {
            display: flex;
            gap: 2rem;
            text-align: center;
        }

        .stat-col {
            display: flex;
            flex-direction: column;
        }

        .stat-label { color: #aaaaaa; font-size: 0.75rem; margin-bottom: 2px; }
        .stat-value { font-weight: bold; color: white; }

        /* 主導覽列與 LOGO */
        nav {
            background-color: var(--primary-color);
            color: white;
            padding: 1rem 5%;
            display: flex;
            align-items: center;
            gap: 3rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* LOGO 圖片設定 */
        .logo {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background-color: white; /* 若 LOGO 去背，可有白色底襯托 */
            object-fit: contain;
            border: 2px solid white;
        }

        .brand h1 { margin: 0; font-size: 1.5rem; }

        .nav-links {
            display: flex;
            gap: 1.5rem;
        }

        .nav-links a {
            color: rgba(255,255,255,0.8);
            font-weight: 600;
            transition: color 0.3s;
        }

        .nav-links a.active, .nav-links a:hover { color: white; }

        /* Hero 區塊 (發現腳下的森林) */
        .hero {
            text-align: center;
            padding: 4rem 1rem;
            background-color: var(--bg-color);
            position: relative;
            overflow: hidden;
        }

        .hero h2 { font-size: 2.5rem; margin-bottom: 0.5rem; color: var(--primary-color); }
        .hero p { font-size: 1.2rem; color: var(--text-muted); }

        /* 裝飾性點點 (模擬設計圖背景) */
        .dot {
            position: absolute;
            background-color: var(--secondary-color);
            border-radius: 50%;
            opacity: 0.2;
        }

        /* 導航員與時間軸區塊 */
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }

        h3.section-title {
            font-size: 1.5rem;
            color: var(--text-main);
            margin-bottom: 3rem;
        }

        /* 進度條設計 */
        .timeline-wrapper {
            position: relative;
            margin-bottom: 3rem;
            padding: 0 20px;
        }

        .timeline-line {
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 2px;
            background-color: #cccccc;
            z-index: 1;
            transform: translateY(-50%);
        }

        .timeline-nodes {
            display: flex;
            justify-content: space-between;
            position: relative;
            z-index: 2;
        }

        .node {
            background-color: var(--bg-color);
            border: 2px solid #aaaaaa;
            border-radius: 50%;
            width: 70px;
            height: 70px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 0.9rem;
            color: #666666;
            font-weight: bold;
        }

        /* 當前進度的節點樣式 */
        .node.active {
            border-color: var(--secondary-color);
            box-shadow: 0 0 0 4px rgba(76, 175, 80, 0.2);
            color: var(--primary-color);
            position: relative;
        }

        .node.active::before {
            content: "目前進度";
            position: absolute;
            top: -35px;
            background-color: var(--primary-color);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            white-space: nowrap;
        }

        /* 內容佔位框 */
        .content-box {
            background-color: var(--card-bg);
            border-radius: 16px;
            height: 300px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            border: 1px solid #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-muted);
        }

        /* 底部控制列 */
        .bottom-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: var(--bottom-bar-bg);
            color: white;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            padding: 10px 5%;
            gap: 2rem;
            box-sizing: border-box;
            z-index: 1000;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
        }

        select {
            background-color: #333;
            color: white;
            border: 1px solid #555;
            padding: 6px 12px;
            border-radius: 20px;
            outline: none;
        }

        /* 切換開關 (Toggle) */
        .switch {
            position: relative;
            display: inline-block;
            width: 40px;
            height: 20px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #555;
            border-radius: 20px;
            transition: .4s;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 14px; width: 14px;
            left: 3px; bottom: 3px;
            background-color: white;
            border-radius: 50%;
            transition: .4s;
        }
        input:checked + .slider { background-color: var(--secondary-color); }
        input:checked + .slider:before { transform: translateX(20px); }

    </style>
</head>
<body>

    <!-- 頂部狀態列 -->
    <div class="status-bar">
        <div>AI 蘚苔探險家 網站預覽</div>
        <div class="status-stats">
            <div class="stat-col">
                <span class="stat-label">當前任務</span>
                <span class="stat-value">實驗設計</span>
            </div>
            <div class="stat-col">
                <span class="stat-label">投稿倒數</span>
                <span class="stat-value" id="top-timer">計算中...</span>
            </div>
            <div class="stat-col">
                <span class="stat-label">建議工具</span>
                <span class="stat-value">資料比例計算機</span>
            </div>
        </div>
    </div>

    <!-- 主導覽列 -->
    <nav>
        <div class="brand">
            <!-- 這裡放入 LOGO 圖片 -->
            <img src="logo.png" alt="蘚苔探險家LOGO" class="logo">
            <h1>AI 蘚苔探險家</h1>
        </div>
        <div class="nav-links">
            <a href="#" class="active">首頁</a>
            <a href="#">探險路徑</a>
            <a href="tools.html">工具箱</a>
            <a href="#">延伸議題</a>
            <a href="#">關於我們</a>
        </div>
    </nav>

    <!-- 主視覺區塊 -->
    <header class="hero">
        <!-- 裝飾點點 -->
        <div class="dot" style="width:10px; height:10px; top:20%; left:20%;"></div>
        <div class="dot" style="width:15px; height:15px; top:60%; left:15%;"></div>
        <div class="dot" style="width:8px; height:8px; top:30%; right:25%;"></div>
        <div class="dot" style="width:12px; height:12px; top:70%; right:10%;"></div>
        
        <h2>發現腳下的森林</h2>
        <p>讓 AI 成為你的科學放大鏡！</p>
    </header>

    <!-- 研究路徑導航員 -->
    <main class="container">
        <h3 class="section-title">研究路徑導航員</h3>
        
        <div class="timeline-wrapper">
            <div class="timeline-line"></div>
            <div class="timeline-nodes">
                <div class="node">Quest 1</div>
                <div class="node">Quest 2</div>
                <div class="node active">Quest 3</div>
                <div class="node">Quest 4</div>
                <div class="node">Quest 5</div>
            </div>
        </div>

        <div class="content-box">
            <p>目前位於 Quest 3：設定探險參數 (實驗設計與數據蒐集區塊)</p>
        </div>
    </main>

    <!-- 底部控制列 -->
    <div class="bottom-bar">
        <div class="control-group">
            <label>當前任務階段</label>
            <select>
                <option>Quest 1: 發現腳下的綠意</option>
                <option>Quest 2: 翻閱自然的檔案</option>
                <option selected>Quest 3: 設定探險參數</option>
                <option>Quest 4: 分析 AI 視野</option>
                <option>Quest 5: 發布探險日誌</option>
            </select>
        </div>
        <div class="control-group" style="margin-left: 20px;">
            <label>顯示配色助手</label>
            <label class="switch">
                <input type="checkbox">
                <span class="slider"></span>
            </label>
        </div>
    </div>

    <!-- 動態腳本區塊 -->
    <script>
        // 設定小論文截稿日期 (以當年 10 月 15 日為例)
        const currentYear = new Date().getFullYear();
        const deadline = new Date(`${currentYear}-10-15T12:00:00`).getTime();

        function updateTimer() {
            const now = new Date().getTime();
            const distance = deadline - now;

            if (distance < 0) {
                document.getElementById("top-timer").innerHTML = "已截止";
                return;
            }

            // 計算天數
            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            document.getElementById("top-timer").innerHTML = `-${days} 天`;
        }

        updateTimer();
        setInterval(updateTimer, 1000 * 60 * 60); // 每小時更新一次天數即可
    </script>
</body>
</html>
