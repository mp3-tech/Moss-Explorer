<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 蘚苔探險家 - 研究儀表板</title>
    <link rel="stylesheet" href="css/style.css?v=5">
    <style>
        /* ── Countdown on index ── */
        .index-timers {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin: 28px 0;
        }
        @media (max-width: 640px) {
            .index-timers { grid-template-columns: 1fr; }
        }
        .index-timer-card {
            background: #fff;
            border: 1px solid var(--border-color, #e0e0e0);
            border-radius: 12px;
            padding: 20px 24px;
            position: relative;
        }
        .index-timer-card h4 {
            margin: 0 0 12px 0;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }
        .timer-label { flex: 1; }
        .btn-timer-settings {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 0.72rem;
            color: var(--text-muted, #888);
            background: #f5f5f5;
            border: 1px solid #ddd;
            border-radius: 20px;
            padding: 3px 10px;
            text-decoration: none;
            white-space: nowrap;
            transition: background 0.2s, color 0.2s;
            cursor: pointer;
            flex-shrink: 0;
        }
        .btn-timer-settings:hover { background: var(--primary, #2e7d32); color: #fff; border-color: var(--primary, #2e7d32); }
        .index-huge-timer {
            font-size: 1.6rem;
            font-weight: 800;
            letter-spacing: 0.02em;
            color: var(--text-main, #222);
            line-height: 1.2;
        }
        .index-huge-timer span {
            font-size: 0.7rem;
            font-weight: 500;
            color: var(--text-muted, #888);
            margin-right: 4px;
        }
        .timer-expired { color: #d32f2f; font-size: 0.95rem; }

        /* ── Web Color Lab ── */
        .wcl-trigger-btn {
            position: fixed;
            bottom: 28px;
            right: 28px;
            z-index: 200;
            background: var(--primary, #2e7d32);
            color: #fff;
            border: none;
            border-radius: 30px;
            padding: 12px 22px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            gap: 8px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .wcl-trigger-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.25); }

        .wcl-panel {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            z-index: 300;
            background: #fff;
            border-top: 2px solid var(--primary, #2e7d32);
            box-shadow: 0 -6px 32px rgba(0,0,0,0.12);
            padding: 20px 28px 24px;
            transform: translateY(100%);
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            max-height: 70vh;
            overflow-y: auto;
        }
        .wcl-panel.open { transform: translateY(0); }
        .wcl-panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
        }
        .wcl-panel-header h3 { margin: 0; font-size: 1rem; display: flex; align-items: center; gap: 8px; }
        .wcl-close-btn {
            background: none; border: none; font-size: 1.2rem; cursor: pointer; color: var(--text-muted,#888); padding: 4px 8px;
        }
        .wcl-input-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .wcl-input-row label { font-size: 0.85rem; color: var(--text-muted,#888); white-space: nowrap; }
        .wcl-hex-input {
            font-size: 0.95rem;
            padding: 8px 12px;
            border: 1.5px solid #ddd;
            border-radius: 8px;
            width: 120px;
            font-family: monospace;
            text-transform: uppercase;
            transition: border-color 0.2s;
        }
        .wcl-hex-input:focus { outline: none; border-color: var(--primary,#2e7d32); }
        .wcl-color-preview {
            width: 36px; height: 36px;
            border-radius: 8px;
            border: 2px solid #eee;
            flex-shrink: 0;
            transition: background 0.3s;
        }
        .wcl-generate-btn {
            background: var(--primary,#2e7d32);
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 9px 18px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .wcl-generate-btn:hover { opacity: 0.88; }
        .wcl-palettes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 16px;
        }
        .wcl-palette-card {
            border: 1.5px solid #eee;
            border-radius: 10px;
            overflow: hidden;
            background: #fafafa;
            transition: box-shadow 0.2s;
        }
        .wcl-palette-card:hover { box-shadow: 0 4px 14px rgba(0,0,0,0.1); }
        .wcl-palette-name {
            font-size: 0.78rem;
            font-weight: 700;
            color: var(--text-muted,#888);
            padding: 8px 12px 4px;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }
        .wcl-swatches {
            display: flex;
            height: 52px;
        }
        .wcl-swatch {
            flex: 1;
            position: relative;
            cursor: pointer;
            transition: flex 0.2s;
        }
        .wcl-swatch:hover { flex: 1.8; }
        .wcl-swatch-tooltip {
            position: absolute;
            bottom: 4px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.65);
            color: #fff;
            font-size: 0.6rem;
            padding: 2px 5px;
            border-radius: 4px;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.15s;
            font-family: monospace;
        }
        .wcl-swatch:hover .wcl-swatch-tooltip { opacity: 1; }
        .wcl-swatch.is-base::after {
            content: '★';
            position: absolute;
            top: 4px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.65rem;
            color: rgba(255,255,255,0.9);
        }
        .wcl-copy-msg {
            font-size: 0.78rem;
            color: var(--primary,#2e7d32);
            font-weight: 600;
            margin-top: 6px;
            min-height: 18px;
            padding: 0 4px;
        }
        .wcl-placeholder {
            text-align: center;
            color: var(--text-muted,#aaa);
            padding: 28px 0;
            font-size: 0.88rem;
        }

        /* Apply palette preview to page */
        .wcl-preview-strip {
            display: flex;
            gap: 6px;
            padding: 8px 12px;
            align-items: center;
            flex-wrap: wrap;
        }
        .wcl-preview-chip {
            width: 20px; height: 20px; border-radius: 50%;
            border: 2px solid #fff;
            box-shadow: 0 1px 4px rgba(0,0,0,0.15);
            cursor: pointer;
            title: '';
        }
    </style>
</head>
<body>

    <div id="splash-screen" class="splash-screen">
        <div class="splash-content">
            <div class="splash-icon-wrapper">
                <div class="splash-icon">🌿</div>
                <div class="splash-scan-line"></div>
            </div>
            <h1 class="splash-title">AI 蘚苔探險家</h1>
            <div class="splash-subtitle-container">
                <span class="splash-subtitle">System Initializing... Load Quest Data...</span>
            </div>
            <div class="splash-progress"><div class="splash-progress-bar"></div></div>
        </div>
    </div>

    <div id="navbar-placeholder"></div>

    <div class="dashboard-container">

        <nav class="breadcrumb">
            <span>🏠 首頁 (AI 科學研究儀表板)</span>
        </nav>

        <!-- ── Hero ── -->
        <section class="hero-banner tech-bg">
            <div class="hero-split" style="justify-content: center; text-align: center;">
                <div class="hero-text-side" style="max-width: 680px; margin: 0 auto;">
                    <div class="tech-badge">Moss Explorer Beta 1.0</div>
                    <h1 class="hero-title">從一片蘚苔開始，<br>展開你的 <span style="color: var(--ai-blue);">AI 科展探險</span></h1>
                    <p class="hero-desc">結合植物觀察、影像辨識與研究工具，協助高中生打造標準化的特徵矩陣，精準完成科展與小論文。</p>
                </div>
            </div>
        </section>

        <!-- ── Countdown Timers ── -->
        <div class="index-timers">
            <div class="index-timer-card">
                <h4>
                    <span class="timer-label" style="color:#1565c0;">🔬 科學展覽會 剩餘時間</span>
                    <a href="countdown.html" class="btn-timer-settings">⚙️ 設定時間</a>
                </h4>
                <div class="index-huge-timer" id="idx-timer-science">
                    --<span>天</span>--<span>時</span>--<span>分</span>--<span>秒</span>
                </div>
            </div>
            <div class="index-timer-card">
                <h4>
                    <span class="timer-label" style="color:#ef6c00;">📝 中學生小論文 剩餘時間</span>
                    <a href="countdown.html" class="btn-timer-settings">⚙️ 設定時間</a>
                </h4>
                <div class="index-huge-timer" id="idx-timer-essay">
                    --<span>天</span>--<span>時</span>--<span>分</span>--<span>秒</span>
                </div>
            </div>
        </div>

    </div><!-- end dashboard-container -->

    <!-- ── Web Color Lab Trigger Button ── -->
    <button class="wcl-trigger-btn" id="wcl-open-btn">🎨 網頁配色實驗</button>

    <!-- ── Web Color Lab Panel ── -->
    <div class="wcl-panel" id="wcl-panel">
        <div class="wcl-panel-header">
            <h3>🎨 網頁配色實驗 <span style="font-size:0.75rem; font-weight:400; color:var(--text-muted);">輸入一個色碼，自動推薦搭配調色盤</span></h3>
            <button class="wcl-close-btn" id="wcl-close-btn">✖</button>
        </div>
        <div class="wcl-input-row">
            <label>輸入色碼</label>
            <div class="wcl-color-preview" id="wcl-preview-box" style="background:#2e7d32;"></div>
            <input type="color" id="wcl-native-picker" value="#2e7d32" style="width:36px;height:36px;border:none;background:none;cursor:pointer;padding:0;" title="點擊選色">
            <input type="text" class="wcl-hex-input" id="wcl-hex-input" value="#2E7D32" maxlength="7" placeholder="#RRGGBB">
            <button class="wcl-generate-btn" id="wcl-generate-btn">推薦配色</button>
        </div>
        <div id="wcl-palettes-area">
            <div class="wcl-placeholder">輸入色碼後點擊「推薦配色」，即可產生 3–6 組調色盤方案 🎨</div>
        </div>
        <div class="wcl-copy-msg" id="wcl-copy-msg"></div>
    </div>

    <script src="js/main.js?v=5"></script>

    <script>
    // ── Countdown on index page ──
    (function() {
        function getTargetDate(key, fallback) {
            const s = localStorage.getItem(key);
            return s ? new Date(s).getTime() : new Date(fallback).getTime();
        }
        function formatDist(ms) {
            if (isNaN(ms) || ms < 0) return '<span class="timer-expired">時間已截止</span>';
            const d = Math.floor(ms / 86400000);
            const h = Math.floor((ms % 86400000) / 3600000).toString().padStart(2,'0');
            const m = Math.floor((ms % 3600000) / 60000).toString().padStart(2,'0');
            const s = Math.floor((ms % 60000) / 1000).toString().padStart(2,'0');
            return `${d}<span>天</span>${h}<span>時</span>${m}<span>分</span>${s}<span>秒</span>`;
        }
        const elSci = document.getElementById('idx-timer-science');
        const elEss = document.getElementById('idx-timer-essay');
        function tick() {
            const now = Date.now();
            const sciDate = getTargetDate('targetDateScience', '2026-09-01T23:59');
            const essDate = getTargetDate('targetDateEssay', '2026-10-15T12:00');
            elSci.innerHTML = formatDist(sciDate - now);
            elEss.innerHTML = formatDist(essDate - now);
        }
        tick();
        setInterval(tick, 1000);
    })();

    // ── Web Color Lab ──
    (function() {
        const openBtn = document.getElementById('wcl-open-btn');
        const closeBtn = document.getElementById('wcl-close-btn');
        const panel = document.getElementById('wcl-panel');
        const hexInput = document.getElementById('wcl-hex-input');
        const nativePicker = document.getElementById('wcl-native-picker');
        const previewBox = document.getElementById('wcl-preview-box');
        const generateBtn = document.getElementById('wcl-generate-btn');
        const palettesArea = document.getElementById('wcl-palettes-area');
        const copyMsg = document.getElementById('wcl-copy-msg');

        openBtn.addEventListener('click', () => panel.classList.add('open'));
        closeBtn.addEventListener('click', () => panel.classList.remove('open'));

        // Sync native picker ↔ text input
        nativePicker.addEventListener('input', () => {
            const v = nativePicker.value.toUpperCase();
            hexInput.value = v;
            previewBox.style.background = v;
        });
        hexInput.addEventListener('input', () => {
            const raw = hexInput.value.trim();
            const v = raw.startsWith('#') ? raw : '#' + raw;
            if (/^#[0-9A-Fa-f]{6}$/.test(v)) {
                nativePicker.value = v.toLowerCase();
                previewBox.style.background = v;
            }
        });

        // ── Color math helpers ──
        function hexToHsl(hex) {
            let r = parseInt(hex.slice(1,3),16)/255;
            let g = parseInt(hex.slice(3,5),16)/255;
            let b = parseInt(hex.slice(5,7),16)/255;
            const max = Math.max(r,g,b), min = Math.min(r,g,b);
            let h, s, l = (max+min)/2;
            if (max === min) { h = s = 0; }
            else {
                const d = max - min;
                s = l > 0.5 ? d/(2-max-min) : d/(max+min);
                switch(max) {
                    case r: h = ((g-b)/d + (g<b?6:0))/6; break;
                    case g: h = ((b-r)/d + 2)/6; break;
                    case b: h = ((r-g)/d + 4)/6; break;
                }
            }
            return [Math.round(h*360), Math.round(s*100), Math.round(l*100)];
        }
        function hslToHex(h, s, l) {
            s /= 100; l /= 100;
            const k = n => (n + h/30) % 12;
            const a = s * Math.min(l, 1-l);
            const f = n => l - a * Math.max(-1, Math.min(k(n)-3, Math.min(9-k(n),1)));
            const toHex = x => Math.round(x*255).toString(16).padStart(2,'0');
            return `#${toHex(f(0))}${toHex(f(8))}${toHex(f(4))}`.toUpperCase();
        }
        function clamp(v, mn, mx) { return Math.max(mn, Math.min(mx, v)); }
        function hAdj(h, deg) { return ((h + deg) % 360 + 360) % 360; }

        function generatePalettes(baseHex) {
            const [h, s, l] = hexToHsl(baseHex);
            const base = baseHex.toUpperCase();

            const palettes = [];

            // 1. Analogous (hue ±30°)
            palettes.push({
                name: '類比配色 Analogous',
                colors: [
                    hslToHex(hAdj(h,-40), clamp(s-5,20,100), clamp(l+5,15,90)),
                    hslToHex(hAdj(h,-20), clamp(s,20,100), clamp(l,15,90)),
                    base,
                    hslToHex(hAdj(h,20),  clamp(s,20,100), clamp(l,15,90)),
                    hslToHex(hAdj(h,40),  clamp(s-5,20,100), clamp(l+5,15,90)),
                ]
            });

            // 2. Complementary (base + opposite + tints/shades)
            const compH = hAdj(h, 180);
            palettes.push({
                name: '互補配色 Complementary',
                colors: [
                    hslToHex(h, clamp(s+10,20,100), clamp(l-15,15,85)),
                    base,
                    hslToHex(h, clamp(s-20,10,80), clamp(l+25,20,95)),
                    hslToHex(compH, clamp(s,20,100), clamp(l,15,85)),
                    hslToHex(compH, clamp(s+10,20,100), clamp(l-15,15,75)),
                ]
            });

            // 3. Triadic (120° apart)
            const tri1 = hAdj(h, 120), tri2 = hAdj(h, 240);
            palettes.push({
                name: '三角配色 Triadic',
                colors: [
                    base,
                    hslToHex(tri1, clamp(s-5,20,100), clamp(l,20,80)),
                    hslToHex(tri2, clamp(s-5,20,100), clamp(l,20,80)),
                    hslToHex(h, clamp(s-30,10,70), clamp(l+25,20,95)),
                ]
            });

            // 4. Split-complementary
            const sp1 = hAdj(h, 150), sp2 = hAdj(h, 210);
            palettes.push({
                name: '分裂互補 Split-Comp',
                colors: [
                    hslToHex(h, clamp(s+10,20,100), clamp(l-10,10,80)),
                    base,
                    hslToHex(h, clamp(s-25,10,70), clamp(l+25,20,95)),
                    hslToHex(sp1, clamp(s,20,100), clamp(l,20,80)),
                    hslToHex(sp2, clamp(s,20,100), clamp(l,20,80)),
                ]
            });

            // 5. Monochromatic (tints & shades)
            palettes.push({
                name: '單色深淺 Monochromatic',
                colors: [
                    hslToHex(h, clamp(s+10,20,100), clamp(l-25,10,60)),
                    hslToHex(h, clamp(s+5,20,100),  clamp(l-12,15,75)),
                    base,
                    hslToHex(h, clamp(s-10,10,90),  clamp(l+15,25,90)),
                    hslToHex(h, clamp(s-25,5,70),   clamp(l+28,35,97)),
                ]
            });

            // 6. Tetradic / Square (90° apart)
            const sq1=hAdj(h,90), sq2=hAdj(h,180), sq3=hAdj(h,270);
            palettes.push({
                name: '四色矩形 Tetradic',
                colors: [
                    base,
                    hslToHex(sq1, clamp(s-5,20,90), clamp(l,20,80)),
                    hslToHex(sq2, clamp(s-5,20,90), clamp(l,20,80)),
                    hslToHex(sq3, clamp(s-5,20,90), clamp(l,20,80)),
                ]
            });

            return palettes;
        }

        function renderPalettes(palettes, baseHex) {
            palettesArea.innerHTML = '';
            const grid = document.createElement('div');
            grid.className = 'wcl-palettes-grid';

            palettes.forEach(p => {
                const card = document.createElement('div');
                card.className = 'wcl-palette-card';

                const nameEl = document.createElement('div');
                nameEl.className = 'wcl-palette-name';
                nameEl.textContent = p.name;
                card.appendChild(nameEl);

                const swatchRow = document.createElement('div');
                swatchRow.className = 'wcl-swatches';
                p.colors.forEach(c => {
                    const sw = document.createElement('div');
                    sw.className = 'wcl-swatch';
                    if (c.toUpperCase() === baseHex.toUpperCase()) sw.classList.add('is-base');
                    sw.style.background = c;
                    const tip = document.createElement('span');
                    tip.className = 'wcl-swatch-tooltip';
                    tip.textContent = c.toUpperCase();
                    sw.appendChild(tip);
                    sw.addEventListener('click', () => {
                        navigator.clipboard.writeText(c.toUpperCase()).catch(()=>{});
                        copyMsg.textContent = `已複製 ${c.toUpperCase()} ✓`;
                        setTimeout(() => copyMsg.textContent = '', 2000);
                    });
                    swatchRow.appendChild(sw);
                });
                card.appendChild(swatchRow);

                // mini hex labels
                const labelsRow = document.createElement('div');
                labelsRow.style.cssText = 'display:flex; padding:4px 8px 8px; gap:4px; flex-wrap:wrap;';
                p.colors.forEach(c => {
                    const chip = document.createElement('span');
                    chip.style.cssText = `font-size:0.6rem; font-family:monospace; color:#888; background:#f5f5f5; border-radius:3px; padding:1px 5px; cursor:pointer;`;
                    chip.textContent = c.toUpperCase();
                    chip.title = '點擊複製';
                    chip.addEventListener('click', () => {
                        navigator.clipboard.writeText(c.toUpperCase()).catch(()=>{});
                        copyMsg.textContent = `已複製 ${c.toUpperCase()} ✓`;
                        setTimeout(() => copyMsg.textContent = '', 2000);
                    });
                    labelsRow.appendChild(chip);
                });
                card.appendChild(labelsRow);
                grid.appendChild(card);
            });

            palettesArea.appendChild(grid);
        }

        generateBtn.addEventListener('click', () => {
            const raw = hexInput.value.trim();
            const v = raw.startsWith('#') ? raw : '#' + raw;
            if (!/^#[0-9A-Fa-f]{6}$/.test(v)) {
                hexInput.style.borderColor = '#d32f2f';
                setTimeout(() => hexInput.style.borderColor = '', 1500);
                return;
            }
            previewBox.style.background = v;
            nativePicker.value = v.toLowerCase();
            const palettes = generatePalettes(v);
            renderPalettes(palettes, v);
        });

        // Auto-generate on page load with default color
        generateBtn.click();
    })();
    </script>
</body>
</html>
