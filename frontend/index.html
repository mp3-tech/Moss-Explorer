<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 蘚苔探險家</title>
    <style>
        /* 全域變數與重置 */
        :root {
            --primary-color: #2e7d32;
            --secondary-color: #4caf50;
            --bg-color: #f1f8e9;
            --card-bg: #ffffff;
            --text-main: #333333;
            --text-muted: #666666;
            --top-bar-bg: #1a1a1a;
            --bottom-bar-bg: #222222;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            padding-bottom: 70px; /* 預留底部控制列的空間 */
            line-height: 1.6;
            transition: background-color 0.3s ease; /* 讓換色更平滑 */
        }

        a { text-decoration: none; color: inherit; }

        /* 頂部狀態列 */
        .status-bar {
            background-color: var(--top-bar-bg);
            color: #eeeeee;
            padding: 0.5rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
        }

        .status-stats {
            display: flex;
            gap: 2rem;
            text-align: center;
        }

        .stat-col {
            display: flex;
            flex-direction: column;
        }

        .stat-label { color: #aaaaaa; font-size: 0.75rem; margin-bottom: 2px; }
        .stat-value { font-weight: bold; color: white; }

        /* 主導覽列與 LOGO */
        nav {
            background-color: var(--primary-color);
            color: white;
            padding: 0.8rem 5%;
            display: flex;
            align-items: center;
            justify-content: space-between; /* 讓 LOGO 和選單分兩邊 */
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background-color 0.3s ease; /* 讓換色更平滑 */
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background-color: white;
            object-fit: contain;
            border: 2px solid white;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary-color);
            font-weight: bold;
            font-size: 0.8rem;
        }

        .brand h1 { margin: 0; font-size: 1.4rem; letter-spacing: 1px;}

        /* 導覽列選單 */
        .nav-links {
            display: flex;
            gap: 1.5rem;
            align-items: center;
        }

        .nav-links a {
            color: rgba(255,255,255,0.8);
            font-weight: 600;
            font-size: 0.95rem;
            transition: color 0.3s;
        }

        .nav-links a.active, .nav-links a:hover { color: white; }

        /* 下拉選單設計 */
        .dropdown {
            position: relative;
            display: inline-block;
        }

        .dropbtn {
            background: none;
            border: none;
            color: rgba(255,255,255,0.8);
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            padding: 0;
            font-family: inherit;
        }

        .dropdown:hover .dropbtn { color: white; }

        .dropdown-content {
            display: none;
            position: absolute;
            background-color: white;
            min-width: 180px;
            box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
            z-index: 100;
            border-radius: 8px;
            overflow: hidden;
            top: 150%;
            right: 0;
        }

        .dropdown-content a {
            color: var(--text-main) !important;
            padding: 12px 16px;
            text-decoration: none;
            display: block;
            font-weight: 500;
        }

        .dropdown-content a:hover {
            background-color: #f1f1f1;
            color: var(--primary-color) !important;
        }

        .dropdown:hover .dropdown-content {
            display: block;
        }

        /* Hero 區塊 */
        .hero {
            text-align: center;
            padding: 4rem 1rem;
            position: relative;
            overflow: hidden;
        }

        .hero h2 { font-size: 2.5rem; margin-bottom: 0.5rem; color: var(--primary-color); }
        .hero p { font-size: 1.2rem; color: var(--text-muted); }

        /* 導航員與時間軸區塊 */
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }

        h3.section-title {
            font-size: 1.5rem;
            color: var(--text-main);
            margin-bottom: 3rem;
        }

        /* 進度條設計 */
        .timeline-wrapper {
            position: relative;
            margin-bottom: 3rem;
            padding: 0 20px;
        }

        .timeline-line {
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 2px;
            background-color: #cccccc;
            z-index: 1;
            transform: translateY(-50%);
        }

        .timeline-nodes {
            display: flex;
            justify-content: space-between;
            position: relative;
            z-index: 2;
        }

        .node {
            background-color: var(--bg-color);
            border: 2px solid #aaaaaa;
            border-radius: 50%;
            width: 70px;
            height: 70px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 0.9rem;
            color: #666666;
            font-weight: bold;
        }

        .node.active {
            border-color: var(--secondary-color);
            box-shadow: 0 0 0 4px rgba(76, 175, 80, 0.2);
            color: var(--primary-color);
            position: relative;
            background-color: white;
        }

        .node.active::before {
            content: "目前進度";
            position: absolute;
            top: -35px;
            background-color: var(--primary-color);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            white-space: nowrap;
        }

        /* 內容佔位框 */
        .content-box {
            background-color: var(--card-bg);
            border-radius: 16px;
            height: 250px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            border: 1px solid #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-muted);
        }

        /* 底部控制列 */
        .bottom-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: var(--bottom-bar-bg);
            color: white;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            padding: 12px 5%;
            gap: 2rem;
            box-sizing: border-box;
            z-index: 1000;
            flex-wrap: wrap; /* 讓小螢幕不跑版 */
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
        }

        /* 即時調色盤區塊 UI */
        .color-picker-wrapper {
            margin-left: auto; /* 推到最右邊 */
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(255,255,255,0.1);
            padding: 5px 15px;
            border-radius: 20px;
        }

        .color-picker-wrapper input[type="color"] {
            border: none;
            width: 25px;
            height: 25px;
            border-radius: 50%;
            cursor: pointer;
            padding: 0;
            background: none;
        }

        .color-picker-wrapper input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
        }
        
        .color-picker-wrapper input[type="color"]::-webkit-color-swatch {
            border: 2px solid #fff;
            border-radius: 50%;
        }

        .reset-btn {
            background-color: #555;
            color: white;
            border: none;
            padding: 4px 10px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: 0.2s;
        }

        .reset-btn:hover { background-color: #777; }

        select {
            background-color: #333;
            color: white;
            border: 1px solid #555;
            padding: 6px 12px;
            border-radius: 20px;
            outline: none;
        }

    </style>
</head>
<body>

    <!-- 頂部狀態列 -->
    <div class="status-bar">
        <div>AI 蘚苔探險家 網站預覽</div>
        <div class="status-stats">
            <div class="stat-col">
                <span class="stat-label">當前任務</span>
                <span class="stat-value">實驗設計</span>
            </div>
            <div class="stat-col">
                <span class="stat-label">投稿倒數</span>
                <span class="stat-value" id="top-timer">計算中...</span>
            </div>
            <div class="stat-col">
                <span class="stat-label">建議工具</span>
                <span class="stat-value">資料比例計算機</span>
            </div>
        </div>
    </div>

    <!-- 主導覽列 (已完全依照企劃書地圖更新) -->
    <nav>
        <div class="brand">
            <div class="logo">蘚苔</div>
            <h1>AI 蘚苔探險家</h1>
        </div>
        <div class="nav-links">
            <a href="#" class="active">首頁</a>
            <a href="#">研究導航路徑</a>
            <a href="#">微觀探險儀</a>
            <a href="#">AI 腦袋怎麼動</a>
            <a href="#">研究工具箱</a>
            <a href="#">延伸議題探索</a>
            
            <!-- 下拉選單收納剩餘的三個項目 -->
            <div class="dropdown">
                <button class="dropbtn">更多資源 ▾</button>
                <div class="dropdown-content">
                    <a href="#">關鍵詞彙索引</a>
                    <a href="#">可供參考組織網站</a>
                    <a href="#">關於探險</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- 主視覺區塊 -->
    <header class="hero">
        <h2>發現腳下的森林</h2>
        <p>讓 AI 成為你的科學放大鏡！</p>
    </header>

    <!-- 研究路徑導航員 -->
    <main class="container">
        <h3 class="section-title">研究路徑導航員</h3>
        
        <div class="timeline-wrapper">
            <div class="timeline-line"></div>
            <div class="timeline-nodes">
                <div class="node">Quest 1</div>
                <div class="node">Quest 2</div>
                <div class="node active">Quest 3</div>
                <div class="node">Quest 4</div>
                <div class="node">Quest 5</div>
            </div>
        </div>

        <div class="content-box">
            <p>目前位於 Quest 3：設定探險參數 (實驗設計與數據蒐集區塊)</p>
        </div>
    </main>

    <!-- 底部控制列 -->
    <div class="bottom-bar">
        <div class="control-group">
            <label>當前任務階段：</label>
            <select>
                <option>Quest 1: 發現腳下的綠意</option>
                <option>Quest 2: 翻閱自然的檔案</option>
                <option selected>Quest 3: 設定探險參數</option>
                <option>Quest 4: 分析 AI 視野</option>
                <option>Quest 5: 發布探險日誌</option>
            </select>
        </div>

        <!-- 網頁端即時調色盤 -->
        <div class="color-picker-wrapper">
            <label style="font-size: 0.85rem; font-weight: bold;">🎨 網站配色即時調校：</label>
            
            <div style="display: flex; align-items: center; gap: 5px;" title="更改主色調(導覽列與文字)">
                <span style="font-size: 0.75rem;">主色</span>
                <input type="color" id="primaryColor" value="#2e7d32">
            </div>
            
            <div style="display: flex; align-items: center; gap: 5px;" title="更改網頁背景色">
                <span style="font-size: 0.75rem;">背景</span>
                <input type="color" id="bgColor" value="#f1f8e9">
            </div>

            <button class="reset-btn" id="resetColors">重設</button>
        </div>
    </div>

    <!-- 動態腳本區塊 -->
    <script>
        // --- 1. 倒數計時器邏輯 ---
        const currentYear = new Date().getFullYear();
        const deadline = new Date(`${currentYear}-10-15T12:00:00`).getTime();

        function updateTimer() {
            const now = new Date().getTime();
            const distance = deadline - now;

            if (distance < 0) {
                document.getElementById("top-timer").innerHTML = "已截止";
                return;
            }

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            document.getElementById("top-timer").innerHTML = `-${days} 天`;
        }

        updateTimer();
        setInterval(updateTimer, 1000 * 60 * 60);

        // --- 2. 網頁端即時配色邏輯 ---
        const primaryPicker = document.getElementById('primaryColor');
        const bgPicker = document.getElementById('bgColor');
        const resetBtn = document.getElementById('resetColors');
        const root = document.documentElement;

        // 預設顏色記憶
        const defaultPrimary = "#2e7d32";
        const defaultBg = "#f1f8e9";

        // 監聽主色調更改
        primaryPicker.addEventListener('input', function(e) {
            root.style.setProperty('--primary-color', e.target.value);
            // 同步稍微改變一下次要顏色(變淺一點)當作點綴
            root.style.setProperty('--secondary-color', e.target.value); 
        });

        // 監聽背景色更改
        bgPicker.addEventListener('input', function(e) {
            root.style.setProperty('--bg-color', e.target.value);
        });

        // 一鍵重設為預設綠色系
        resetBtn.addEventListener('click', function() {
            root.style.setProperty('--primary-color', defaultPrimary);
            root.style.setProperty('--secondary-color', '#4caf50');
            root.style.setProperty('--bg-color', defaultBg);
            primaryPicker.value = defaultPrimary;
            bgPicker.value = defaultBg;
        });
    </script>
</body>
</html>
