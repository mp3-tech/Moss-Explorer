<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 蘚苔探險家 </title>
    <link rel="stylesheet" href="css/style.css?v=7">
    <style>
        /* ========================================================
           PAGE BACKGROUND  — spreads from the hero title outward
           ======================================================== */
        body {
            background: #fff;
            margin: 0;
        }

        /* The full-page canvas behind everything */
        #page-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            /* radial bloom from the centre of the viewport */
            background:
                radial-gradient(ellipse 80% 60% at 50% 42%,
                    color-mix(in srgb, var(--primary, #2e7d32) 55%, transparent) 0%,
                    color-mix(in srgb, var(--primary, #2e7d32) 28%, transparent) 38%,
                    color-mix(in srgb, var(--primary, #2e7d32) 10%, transparent) 65%,
                    transparent 100%),
                linear-gradient(165deg,
                    color-mix(in srgb, var(--primary, #2e7d32) 18%, #f0f7f0) 0%,
                    #f7faf5 55%,
                    #fff 100%);
            transition: background 0.6s ease;
            pointer-events: none;
        }

        /* Very large ghost text that IS the background texture */
        #page-bg::before {
            content: "從一片蘚苔開始";
            position: absolute;
            top: 12%;
            left: 50%;
            transform: translateX(-50%);
            font-size: clamp(3.5rem, 10vw, 9rem);
            font-weight: 900;
            letter-spacing: -0.02em;
            white-space: nowrap;
            color: var(--primary, #2e7d32);
            opacity: 0.055;
            pointer-events: none;
            line-height: 1;
        }
        #page-bg::after {
            content: "展開你的 AI 科展探險";
            position: absolute;
            top: calc(12% + clamp(3.5rem, 11vw, 10rem));
            left: 50%;
            transform: translateX(-50%);
            font-size: clamp(2.2rem, 6.5vw, 5.8rem);
            font-weight: 900;
            letter-spacing: -0.01em;
            white-space: nowrap;
            color: var(--primary, #2e7d32);
            opacity: 0.04;
            pointer-events: none;
            line-height: 1;
        }

        /* ========================================================
           LAYOUT
           ======================================================== */
        #navbar-placeholder,
        #navbar-placeholder > * { position: relative; z-index: 100; }

        .page-shell {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* ── Hero ── */
        .idx-badge {
            display: inline-block;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--primary, #2e7d32);
            background: color-mix(in srgb, var(--primary, #2e7d32) 12%, white);
            border: 1px solid color-mix(in srgb, var(--primary, #2e7d32) 25%, transparent);
            border-radius: 20px;
            padding: 5px 16px;
            margin-bottom: 28px;
        }

        .idx-title {
            font-size: clamp(2rem, 5.5vw, 4.2rem);
            font-weight: 900;
            line-height: 1.18;
            color: #1a1a1a;
            letter-spacing: -0.025em;
            margin: 0 0 20px;
            max-width: 760px;
        }
        .idx-title .highlight {
            color: var(--primary, #2e7d32);
            position: relative;
        }
        .idx-title .highlight::after {
            content: '';
            position: absolute;
            left: 0; right: 0; bottom: 2px;
            height: 3px;
            background: var(--primary, #2e7d32);
            opacity: 0.3;
            border-radius: 2px;
        }

        .idx-desc {
            font-size: clamp(0.9rem, 1.8vw, 1.05rem);
            color: #555;
            max-width: 560px;
            line-height: 1.7;
            margin: 0 0 36px;
        }

        .idx-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: flex-start;
        }

        /* ── Hero split layout ── */
        .idx-hero {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: clamp(48px, 10vh, 100px) 40px clamp(32px, 6vh, 72px);
        }
        .idx-hero-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 48px;
            max-width: 1060px;
            width: 100%;
        }
        .idx-hero-text {
            flex: 1;
            min-width: 0;
            text-align: left;
        }
        .idx-hero-visual {
            flex-shrink: 0;
            width: clamp(260px, 34vw, 400px);
        }
        @media (max-width: 820px) {
            .idx-hero { padding: 48px 24px 32px; }
            .idx-hero-inner { flex-direction: column; align-items: center; }
            .idx-hero-text { text-align: center; }
            .idx-actions { justify-content: center; }
            .idx-hero-visual { width: min(320px, 85vw); }
        }

        /* ── AI Scanner Box ── */
        .ai-scanner {
            position: relative;
            width: 100%;
            aspect-ratio: 4/3;
            background: radial-gradient(ellipse at 50% 40%,
                color-mix(in srgb, var(--primary,#2e7d32) 85%, #000) 0%,
                color-mix(in srgb, var(--primary,#2e7d32) 55%, #000) 60%,
                color-mix(in srgb, var(--primary,#2e7d32) 30%, #000) 100%);
            border-radius: 18px;
            overflow: hidden;
            box-shadow:
                0 0 0 1.5px color-mix(in srgb, var(--primary,#2e7d32) 40%, #0ff),
                0 12px 48px rgba(0,0,0,0.35),
                inset 0 1px 0 rgba(255,255,255,0.08);
        }

        /* grid lines */
        .ai-scanner::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(255,255,255,0.055) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.055) 1px, transparent 1px);
            background-size: 28px 28px;
        }

        /* scanning line */
        .scan-line {
            position: absolute;
            left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg,
                transparent 0%, rgba(0,255,120,0.0) 10%,
                rgba(0,255,120,0.7) 50%,
                rgba(0,255,120,0.0) 90%, transparent 100%);
            box-shadow: 0 0 10px 2px rgba(0,255,120,0.35);
            animation: scanMove 2.8s ease-in-out infinite;
            z-index: 3;
        }
        @keyframes scanMove {
            0%   { top: 8%; opacity: 0; }
            10%  { opacity: 1; }
            90%  { opacity: 1; }
            100% { top: 88%; opacity: 0; }
        }

        /* bounding box */
        .scan-bbox {
            position: absolute;
            top: 20%; left: 22%; right: 22%; bottom: 18%;
            border: 1.5px solid rgba(0,255,120,0.75);
            border-radius: 4px;
            box-shadow: 0 0 12px rgba(0,255,120,0.2), inset 0 0 12px rgba(0,255,120,0.06);
            z-index: 2;
            animation: bboxPulse 2.8s ease-in-out infinite;
        }
        @keyframes bboxPulse {
            0%,100% { opacity: 0.65; }
            50%      { opacity: 1; }
        }
        /* corner accents */
        .scan-bbox::before, .scan-bbox::after {
            content: '';
            position: absolute;
            width: 14px; height: 14px;
            border-color: rgba(0,255,120,0.95);
            border-style: solid;
        }
        .scan-bbox::before {
            top: -2px; left: -2px;
            border-width: 2px 0 0 2px;
        }
        .scan-bbox::after {
            bottom: -2px; right: -2px;
            border-width: 0 2px 2px 0;
        }

        /* placeholder leaf */
        .scan-target {
            position: absolute;
            top: 20%; left: 22%; right: 22%; bottom: 18%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1;
            gap: 8px;
        }
        .scan-leaf {
            font-size: clamp(2rem, 5vw, 3rem);
            opacity: 0.55;
            filter: drop-shadow(0 2px 8px rgba(0,0,0,0.4));
        }
        .scan-filename {
            font-family: monospace;
            font-size: 0.68rem;
            color: rgba(255,255,255,0.4);
            letter-spacing: 0.04em;
        }

        /* HUD tags */
        .scan-tag {
            position: absolute;
            font-family: 'Courier New', monospace;
            font-size: 0.7rem;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 4px;
            letter-spacing: 0.06em;
            z-index: 4;
            animation: tagBlink 2.8s ease-in-out infinite;
        }
        @keyframes tagBlink {
            0%,100% { opacity: 0.8; }
            50%      { opacity: 1; }
        }
        .scan-tag-tl {
            top: 10%; left: 8%;
            background: rgba(0,0,0,0.55);
            border: 1px solid rgba(0,255,120,0.6);
            color: rgba(0,255,180,0.95);
        }
        .scan-tag-br {
            bottom: 10%; right: 6%;
            background: rgba(0,0,0,0.55);
            border: 1px solid rgba(100,180,255,0.6);
            color: rgba(120,200,255,0.95);
        }
        .idx-btn-primary {
            background: var(--primary, #2e7d32);
            color: #fff;
            border: none;
            border-radius: 10px;
            padding: 13px 28px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.18s, transform 0.18s, box-shadow 0.18s;
            box-shadow: 0 4px 18px color-mix(in srgb, var(--primary, #2e7d32) 35%, transparent);
        }
        .idx-btn-primary:hover {
            opacity: 0.88;
            transform: translateY(-2px);
            box-shadow: 0 6px 24px color-mix(in srgb, var(--primary, #2e7d32) 45%, transparent);
        }
        .idx-btn-outline {
            background: transparent;
            color: var(--primary, #2e7d32);
            border: 2px solid color-mix(in srgb, var(--primary, #2e7d32) 45%, transparent);
            border-radius: 10px;
            padding: 11px 26px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: border-color 0.18s, background 0.18s, transform 0.18s;
        }
        .idx-btn-outline:hover {
            border-color: var(--primary, #2e7d32);
            background: color-mix(in srgb, var(--primary, #2e7d32) 6%, transparent);
            transform: translateY(-2px);
        }

        /* ── Countdown section ── */
        .idx-timers-wrap {
            padding: 0 40px 48px;
        }
        .idx-timers {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            max-width: 1060px;
            margin: 0 auto;
        }
        @media (max-width: 600px) {
            .idx-timers { grid-template-columns: 1fr; }
            .idx-timers-wrap { padding: 0 24px 40px; }
        }
        .idx-timer-card {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.9);
            border-radius: 12px;
            padding: 14px 20px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.07), 0 1px 4px rgba(0,0,0,0.04);
            transition: background 0.5s, border-color 0.5s;
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .idx-timer-card h4 {
            margin: 0;
            font-size: 0.8rem;
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex-shrink: 0;
        }
        .timer-label { font-weight: 600; white-space: nowrap; }
        .btn-timer-link {
            font-size: 0.65rem;
            color: var(--primary, #2e7d32);
            background: color-mix(in srgb, var(--primary, #2e7d32) 10%, white);
            border: 1px solid color-mix(in srgb, var(--primary, #2e7d32) 22%, transparent);
            border-radius: 20px;
            padding: 2px 10px;
            text-decoration: none;
            white-space: nowrap;
            transition: background 0.18s, color 0.18s;
            font-weight: 600;
            align-self: flex-start;
        }
        .btn-timer-link:hover {
            background: var(--primary, #2e7d32);
            color: #fff;
        }
        .idx-timer-divider {
            width: 1px;
            height: 36px;
            background: #e0e0e0;
            flex-shrink: 0;
        }
        .idx-huge-timer {
            font-size: 1.45rem;
            font-weight: 800;
            letter-spacing: 0.01em;
            color: #1a1a1a;
            line-height: 1;
            flex: 1;
        }
        .idx-huge-timer span {
            font-size: 0.62rem;
            font-weight: 500;
            color: #aaa;
            margin-right: 3px;
        }
        .timer-expired { color: #c62828; font-size: 0.85rem; font-weight: 600; }

        /* ========================================================
           WEB COLOR LAB
           ======================================================== */
        .wcl-fab {
            position: fixed;
            bottom: 28px; right: 28px;
            z-index: 400;
            background: var(--primary, #2e7d32);
            color: #fff;
            border: none;
            border-radius: 30px;
            padding: 12px 22px;
            font-size: 0.88rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 18px rgba(0,0,0,0.22);
            display: flex; align-items: center; gap: 8px;
            transition: transform 0.18s, box-shadow 0.18s, background 0.4s;
            letter-spacing: 0.01em;
        }
        .wcl-fab:hover { transform: translateY(-2px); box-shadow: 0 6px 22px rgba(0,0,0,0.28); }
        .wcl-saved-dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: #ffca28; display: none; flex-shrink: 0;
        }
        .wcl-saved-dot.on { display: block; }

        .wcl-panel {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            z-index: 500;
            background: #fff;
            border-top: 2.5px solid var(--primary, #2e7d32);
            box-shadow: 0 -8px 40px rgba(0,0,0,0.13);
            padding: 20px 28px 24px;
            transform: translateY(100%);
            transition: transform 0.35s cubic-bezier(0.4,0,0.2,1);
            max-height: 72vh;
            overflow-y: auto;
        }
        .wcl-panel.open { transform: translateY(0); }

        .wcl-head {
            display: flex; align-items: flex-start;
            justify-content: space-between;
            gap: 12px; flex-wrap: wrap;
            margin-bottom: 16px;
        }
        .wcl-head-left h3 {
            margin: 0 0 4px; font-size: 1rem; font-weight: 700;
        }
        .wcl-head-sub {
            font-size: 0.75rem; color: #999; display: block;
        }
        .wcl-preview-tag {
            display: none;
            font-size: 0.71rem; font-weight: 700;
            background: #fff3e0; color: #e65100;
            border-radius: 5px; padding: 2px 9px;
            margin-top: 4px;
        }
        .wcl-preview-tag.on { display: inline-block; }
        .wcl-head-right { display: flex; align-items: center; gap: 8px; }
        .wcl-save {
            background: var(--primary, #2e7d32); color: #fff;
            border: none; border-radius: 8px;
            padding: 8px 20px; font-size: 0.85rem; font-weight: 700;
            cursor: pointer; opacity: 0.3; pointer-events: none;
            transition: opacity 0.18s, transform 0.15s;
        }
        .wcl-save.on { opacity: 1; pointer-events: all; }
        .wcl-save.on:hover { transform: scale(1.03); }
        .wcl-x {
            background: none; border: none; font-size: 1.1rem;
            cursor: pointer; color: #aaa; padding: 4px 8px; line-height: 1;
        }

        .wcl-inputs {
            display: flex; align-items: center;
            gap: 10px; margin-bottom: 18px; flex-wrap: wrap;
        }
        .wcl-inputs label { font-size: 0.82rem; color: #999; white-space: nowrap; }
        .wcl-swatch-box {
            width: 34px; height: 34px; border-radius: 8px;
            border: 2px solid #eee; flex-shrink: 0; transition: background 0.25s;
        }
        .wcl-hex {
            font-size: 0.92rem; padding: 7px 11px;
            border: 1.5px solid #ddd; border-radius: 8px;
            width: 114px; font-family: monospace;
            text-transform: uppercase;
            transition: border-color 0.18s;
        }
        .wcl-hex:focus { outline: none; border-color: var(--primary, #2e7d32); }
        .wcl-gen {
            background: var(--primary, #2e7d32); color: #fff;
            border: none; border-radius: 8px;
            padding: 8px 18px; font-size: 0.84rem; font-weight: 600;
            cursor: pointer; transition: opacity 0.18s;
        }
        .wcl-gen:hover { opacity: 0.85; }

        .wcl-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(244px, 1fr));
            gap: 13px;
        }
        .wcl-card {
            border: 2px solid #ebebeb; border-radius: 10px;
            overflow: hidden; background: #fafafa;
            cursor: pointer;
            transition: box-shadow 0.18s, border-color 0.18s, transform 0.14s;
        }
        .wcl-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.1); transform: translateY(-1px); }
        .wcl-card.on {
            border-color: var(--primary, #2e7d32);
            box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary,#2e7d32) 18%, transparent);
        }
        .wcl-card-head {
            display: flex; align-items: center; justify-content: space-between;
            padding: 8px 12px 3px;
        }
        .wcl-pname {
            font-size: 0.71rem; font-weight: 700;
            color: #aaa; text-transform: uppercase; letter-spacing: 0.05em;
        }
        .wcl-atag {
            font-size: 0.62rem; background: var(--primary,#2e7d32);
            color: #fff; border-radius: 4px; padding: 1px 7px; display: none;
        }
        .wcl-card.on .wcl-atag { display: inline-block; }
        .wcl-swatches { display: flex; height: 52px; }
        .wcl-sw {
            flex: 1; position: relative; transition: flex 0.16s;
        }
        .wcl-sw:hover { flex: 1.7; }
        .wcl-tip {
            position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.6); color: #fff;
            font-size: 0.56rem; padding: 2px 5px; border-radius: 3px;
            white-space: nowrap; opacity: 0; pointer-events: none;
            transition: opacity 0.12s; font-family: monospace;
        }
        .wcl-sw:hover .wcl-tip { opacity: 1; }
        .wcl-sw.base::after {
            content: 'base'; position: absolute; top: 5px; left: 50%; transform: translateX(-50%);
            font-size: 0.52rem; color: rgba(255,255,255,0.85); font-weight: 700; letter-spacing: 0.04em;
        }
        .wcl-chips {
            display: flex; padding: 5px 8px 8px; gap: 3px; flex-wrap: wrap;
        }
        .wcl-chip {
            font-size: 0.56rem; font-family: monospace; color: #888;
            background: #efefef; border-radius: 3px; padding: 2px 5px;
            cursor: pointer; transition: background 0.12s;
        }
        .wcl-chip:hover { background: #ddd; }
        .wcl-msg {
            font-size: 0.78rem; color: var(--primary,#2e7d32);
            font-weight: 600; min-height: 18px; margin-top: 8px;
        }
        .wcl-empty {
            text-align: center; color: #ccc; padding: 28px 0; font-size: 0.88rem;
        }

        /* ── 首頁專屬麵包屑對齊框架 ── */
        .idx-breadcrumb-wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
            padding: 24px 40px 0; /* 與下方的 Hero 區塊維持相同的左右 padding */
            box-sizing: border-box;
            position: relative;
            z-index: 10;
        }
        .idx-breadcrumb-inner {
            width: 100%;
            max-width: 1060px; /* 精準對齊 Hero 區塊文字的 max-width */
            margin-bottom: 0; 
        }
        @media (max-width: 820px) { 
            .idx-breadcrumb-wrapper { padding: 16px 24px 0; } 
        }
    </style>
</head>
<body> 
    <div id="splash-screen" class="splash-screen"> 
        <div class="splash-content"> 
            <div class="splash-icon-wrapper"> 
                <div class="splash-icon"></div> 
                <div class="splash-scan-line"></div> 
            </div> 
            <h1 class="splash-title">AI 蘚苔探險家</h1> 
            <div class="splash-subtitle-container"> 
                <span class="splash-subtitle">System Initializing... Load Quest Data...</span> 
            </div> 
            <div class="splash-progress"><div class="splash-progress-bar"></div></div> 
        </div> 
    </div> 
    <div id="page-bg"></div> 
    <div id="navbar-placeholder"></div> 
    
    <div class="page-shell">

        <section class="idx-hero"> 
            <div class="idx-hero-inner"> 
                <div class="idx-hero-text"> 
                    <span class="idx-badge">Moss Explorer Beta 1.0</span> 
                    <h1 class="idx-title"> 從一片蘚苔開始，<br> 展開你的 <span class="highlight">AI 科展探險</span> </h1> 
                    <p class="idx-desc"> 結合植物觀察、影像辨識與研究工具，協助高中生打造標準化的特徵矩陣，精準完成科展與小論文。</p> 
                    <div class="idx-actions"> 
                        <button class="idx-btn-primary" onclick="location.href='quest.html'">開始研究 (Quest)</button> 
                        <button class="idx-btn-outline" onclick="location.href='tools.html'">進入研究工具箱</button> 
                    </div> 
                </div> 
                <div class="idx-hero-visual"> 
                    <div class="ai-scanner"> 
                        <div class="scan-line"></div> 
                        <div class="scan-bbox"></div> 
                        <div class="scan-target"><img src="images/hero-moss.jpg" alt="苔蘚樣本" style="width:100%;height:100%;object-fit:cover;border-radius:3px;opacity:0.85;"></div> 
                        <div class="scan-tag scan-tag-tl">Target Detected</div> 
                        <div class="scan-tag scan-tag-br">Probability: 98.5%</div> 
                    </div> 
                </div> 
            </div> 
        </section> 
        <div class="idx-timers-wrap"> 
            <div class="idx-timers"> 
                <div class="idx-timer-card"> 
                    <h4> <span class="timer-label" style="color:#1565c0;">科學展覽會 剩餘時間</span> <a href="countdown.html" class="btn-timer-link">設定時間</a> </h4> 
                    <div class="idx-timer-divider"></div> 
                    <div class="idx-huge-timer" id="idx-sci"></div> 
                </div> 
                <div class="idx-timer-card"> 
                    <h4> <span class="timer-label" style="color:#ef6c00;">中學生小論文 剩餘時間</span> <a href="countdown.html" class="btn-timer-link">設定時間</a> </h4> 
                    <div class="idx-timer-divider"></div> 
                    <div class="idx-huge-timer" id="idx-ess"></div> 
                </div> 
            </div> 
        </div> 
    </div><button class="wcl-fab" id="wcl-fab"> 
        <span class="wcl-saved-dot" id="wcl-dot"></span> 網頁配色實驗
    </button> 
    <div class="wcl-panel" id="wcl-panel"> 
        <div class="wcl-head"> 
            <div class="wcl-head-left"> 
                <h3>網頁配色實驗</h3> 
                <span class="wcl-head-sub">輸入色碼推薦調色盤，點擊方案即時套用全站配色</span> 
                <span class="wcl-preview-tag" id="wcl-ptag">預覽中，尚未儲存</span> 
            </div> 
            <div class="wcl-head-right"> 
                <button class="wcl-save" id="wcl-save">儲存配色</button> 
                <button class="wcl-x" id="wcl-x"></button> 
            </div> 
        </div> 
        <div class="wcl-inputs"> 
            <label>輸入色碼</label> 
            <div class="wcl-swatch-box" id="wcl-sw0" style="background:#2e7d32;"></div> 
            <input type="color" id="wcl-picker" value="#2e7d32" style="width:34px;height:34px;border:none;background:none;cursor:pointer;padding:0;"> 
            <input type="text" class="wcl-hex" id="wcl-hex" value="#2E7D32" maxlength="7" placeholder="#RRGGBB"> 
            <button class="wcl-gen" id="wcl-gen">推薦配色</button> 
        </div> 
        <div id="wcl-area"><div class="wcl-empty">輸入色碼後點擊「推薦配色」，產生 6 組調色盤方案</div></div> 
        <div class="wcl-msg" id="wcl-msg"></div> 
    </div> 
    
    <script src="js/main.js?v=7"></script> 
    <script> // ── Countdown ──────────────────────────────────────────────
    (function () {
        function getMs(k, fb) {
            const s = localStorage.getItem(k);
            return s ? new Date(s).getTime() : new Date(fb).getTime();
        }
        function fmt(ms) {
            if (isNaN(ms) || ms < 0) return '<span class="timer-expired">時間已截止</span>';
            const d = Math.floor(ms / 86400000);
            const h = Math.floor((ms % 86400000) / 3600000).toString().padStart(2,'0');
            const m = Math.floor((ms % 3600000) / 60000).toString().padStart(2,'0');
            const s = Math.floor((ms % 60000) / 1000).toString().padStart(2,'0');
            return `${d}<span>天</span>${h}<span>時</span>${m}<span>分</span>${s}<span>秒</span>`;
        }
        const eSci = document.getElementById('idx-sci');
        const eEss = document.getElementById('idx-ess');
        function tick() {
            const now = Date.now();
            eSci.innerHTML = fmt(getMs('targetDateScience','2026-09-01T23:59') - now);
            eEss.innerHTML = fmt(getMs('targetDateEssay','2026-10-15T12:00') - now);
        }
        tick(); setInterval(tick, 1000);
    })();

    // ── Web Color Lab ──────────────────────────────────────────
    (function () {
        const SK = 'siteColorTheme';
        const fab    = document.getElementById('wcl-fab');
        const panel  = document.getElementById('wcl-panel');
        const xBtn   = document.getElementById('wcl-x');
        const sw0    = document.getElementById('wcl-sw0');
        const picker = document.getElementById('wcl-picker');
        const hexIn  = document.getElementById('wcl-hex');
        const genBtn = document.getElementById('wcl-gen');
        const area   = document.getElementById('wcl-area');
        const msgEl  = document.getElementById('wcl-msg');
        const saveB  = document.getElementById('wcl-save');
        const dot    = document.getElementById('wcl-dot');
        const ptag   = document.getElementById('wcl-ptag');
        const pageBg = document.getElementById('page-bg');

        let pending = null, saved_flag = false, activeCard = null;

        // Load saved
        const stored = localStorage.getItem(SK);
        if (stored) {
            try { applyVars(JSON.parse(stored)); dot.classList.add('on'); saved_flag = true; }
            catch(e) {}
        }

        // 1. 點擊按鈕開啟面板
        fab.addEventListener('click', (e) => {
            panel.classList.add('open');
        });

        // 2. 點擊 X 按鈕關閉
        xBtn.addEventListener('click', () => {
            if (pending && !saved_flag) revert();
            panel.classList.remove('open');
        });

        // 3. 【全新加入】點擊網頁其他空白處，自動收合面板
        document.addEventListener('click', (e) => {
            // 如果面板是開著的
            if (panel.classList.contains('open')) {
                // 判斷點擊的位置「不是面板本身」也「不是打開按鈕」
                if (!panel.contains(e.target) && !fab.contains(e.target)) {
                    if (pending && !saved_flag) revert(); // 如果只是預覽沒按儲存，收起來時自動復原
                    panel.classList.remove('open');
                }
            }
        });

        picker.addEventListener('input', () => {
            const v = picker.value.toUpperCase();
            hexIn.value = v; sw0.style.background = v;
        });
        hexIn.addEventListener('input', () => {
            let v = hexIn.value.trim();
            if (!/^#/.test(v)) v = '#' + v;
            if (/^#[0-9A-Fa-f]{6}$/.test(v)) {
                picker.value = v.toLowerCase(); sw0.style.background = v;
            }
        });

        genBtn.addEventListener('click', () => {
            let v = hexIn.value.trim();
            if (!/^#/.test(v)) v = '#' + v;
            if (!/^#[0-9A-Fa-f]{6}$/.test(v)) {
                hexIn.style.borderColor = '#d32f2f';
                setTimeout(() => hexIn.style.borderColor = '', 1400); return;
            }
            picker.value = v.toLowerCase(); sw0.style.background = v;
            render(buildPalettes(v), v);
            activeCard = null;
        });

        saveB.addEventListener('click', () => {
            if (!pending) return;
            localStorage.setItem(SK, JSON.stringify(pending));
            saved_flag = true; dot.classList.add('on');
            saveB.classList.remove('on'); ptag.classList.remove('on');
            msgEl.textContent = '配色已儲存！全站套用生效。';
            setTimeout(() => msgEl.textContent = '', 2800);
        });

        function applyVars(t) {
            const r = document.documentElement;
            r.style.setProperty('--primary',   t.primary);
            r.style.setProperty('--secondary', t.secondary);
            r.style.setProperty('--accent',    t.accent);
            // Re-paint the page background bloom with new primary
            pageBg.style.background = buildBg(t.primary);
            // Scanner box gradient also uses --primary via CSS var — no extra JS needed
            // Timer cards light tint
            document.querySelectorAll('.idx-timer-card').forEach(el => {
                el.style.borderColor = hexAlpha(t.primary, 0.12);
            });
            // Fab button color
            fab.style.background = t.primary;
        }

        function buildBg(primary) {
            return `
                radial-gradient(ellipse 80% 60% at 50% 42%,
                    ${hexAlpha(primary, 0.5)} 0%,
                    ${hexAlpha(primary, 0.24)} 38%,
                    ${hexAlpha(primary, 0.08)} 65%,
                    transparent 100%),
                linear-gradient(165deg,
                    ${hexAlpha(primary, 0.15)} 0%,
                    #f7faf5 55%,
                    #fff 100%)
            `;
        }

        function hexAlpha(hex, a) {
            const r = parseInt(hex.slice(1,3),16);
            const g = parseInt(hex.slice(3,5),16);
            const b = parseInt(hex.slice(5,7),16);
            return `rgba(${r},${g},${b},${a})`;
        }

        function revert() {
            const s = localStorage.getItem(SK);
            if (s) { applyVars(JSON.parse(s)); }
            else {
                const r = document.documentElement;
                r.style.removeProperty('--primary');
                r.style.removeProperty('--secondary');
                r.style.removeProperty('--accent');
                pageBg.style.background = '';
            }
            pending = null;
            saveB.classList.remove('on'); ptag.classList.remove('on');
        }

        function preview(t) {
            applyVars(t); pending = t; saved_flag = false;
            saveB.classList.add('on'); ptag.classList.add('on');
        }

        // colour math
        function hexToHsl(hex) {
            let r=parseInt(hex.slice(1,3),16)/255, g=parseInt(hex.slice(3,5),16)/255, b=parseInt(hex.slice(5,7),16)/255;
            const mx=Math.max(r,g,b), mn=Math.min(r,g,b); let h,s,l=(mx+mn)/2;
            if(mx===mn){h=s=0;}
            else{const d=mx-mn; s=l>.5?d/(2-mx-mn):d/(mx+mn);
                switch(mx){case r:h=((g-b)/d+(g<b?6:0))/6;break;case g:h=((b-r)/d+2)/6;break;case b:h=((r-g)/d+4)/6;break;}}
            return [Math.round(h*360),Math.round(s*100),Math.round(l*100)];
        }
        function hslToHex(h,s,l){
            s/=100;l/=100;
            const k=n=>(n+h/30)%12, a=s*Math.min(l,1-l), f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));
            const x=v=>Math.round(v*255).toString(16).padStart(2,'0');
            return '#'+x(f(0))+x(f(8))+x(f(4));
        }
        function cl(v,a,b){return Math.max(a,Math.min(b,v));}
        function hA(h,d){return((h+d)%360+360)%360;}

        function paletteToTheme(cols) {
            const s=[...cols].sort((a,b)=>hexToHsl(a)[2]-hexToHsl(b)[2]);
            const primary=s[0], secondary=s[Math.floor(s.length*.45)]||s[1], accent=s[Math.floor(s.length*.65)]||s[2];
            const lh=hexToHsl(s[s.length-1]); const bg=lh[2]>80?s[s.length-1]:hslToHex(lh[0],Math.max(lh[1]-20,3),94);
            return {primary,secondary,accent,bg};
        }

        function buildPalettes(B) {
            B=B.toUpperCase(); const [h,s,l]=hexToHsl(B);
            const cH=hA(h,180),t1=hA(h,120),t2=hA(h,240),sp1=hA(h,150),sp2=hA(h,210),sq1=hA(h,90),sq2=hA(h,180),sq3=hA(h,270);
            return [
                {name:'類比配色  Analogous',colors:[hslToHex(hA(h,-40),cl(s-5,20,100),cl(l+5,15,90)),hslToHex(hA(h,-20),cl(s,20,100),cl(l,15,85)),B,hslToHex(hA(h,20),cl(s,20,100),cl(l,15,85)),hslToHex(hA(h,40),cl(s-5,20,100),cl(l+5,15,92))]},
                {name:'互補配色  Complementary',colors:[hslToHex(h,cl(s+10,20,100),cl(l-18,10,78)),B,hslToHex(h,cl(s-20,5,75),cl(l+28,20,94)),hslToHex(cH,cl(s,20,100),cl(l,15,80)),hslToHex(cH,cl(s+10,20,100),cl(l-15,10,72))]},
                {name:'三角配色  Triadic',colors:[B,hslToHex(t1,cl(s-5,20,100),cl(l,20,80)),hslToHex(t2,cl(s-5,20,100),cl(l,20,80)),hslToHex(h,cl(s-30,5,65),cl(l+26,20,94))]},
                {name:'分裂互補  Split-Comp',colors:[hslToHex(h,cl(s+10,20,100),cl(l-12,10,78)),B,hslToHex(h,cl(s-25,5,70),cl(l+26,20,94)),hslToHex(sp1,cl(s,20,100),cl(l,20,80)),hslToHex(sp2,cl(s,20,100),cl(l,20,80))]},
                {name:'單色深淺  Monochromatic',colors:[hslToHex(h,cl(s+10,20,100),cl(l-28,8,58)),hslToHex(h,cl(s+5,20,100),cl(l-12,15,72)),B,hslToHex(h,cl(s-10,5,90),cl(l+15,25,90)),hslToHex(h,cl(s-25,3,65),cl(l+30,35,97))]},
                {name:'四色矩形  Tetradic',colors:[B,hslToHex(sq1,cl(s-5,20,90),cl(l,20,80)),hslToHex(sq2,cl(s-5,20,90),cl(l,20,80)),hslToHex(sq3,cl(s-5,20,90),cl(l,20,80))]},
            ];
        }

        function copyHex(c) {
            navigator.clipboard.writeText(c.toUpperCase()).catch(()=>{});
            msgEl.textContent='已複製 '+c.toUpperCase()+'  ';
            setTimeout(()=>msgEl.textContent='',2000);
        }

        function render(palettes, baseHex) {
            area.innerHTML='';
            const grid=document.createElement('div'); grid.className='wcl-grid';
            palettes.forEach(p=>{
                const card=document.createElement('div'); card.className='wcl-card';
                const hd=document.createElement('div'); hd.className='wcl-card-head';
                const nm=document.createElement('span'); nm.className='wcl-pname'; nm.textContent=p.name;
                const tg=document.createElement('span'); tg.className='wcl-atag'; tg.textContent='套用中';
                hd.appendChild(nm); hd.appendChild(tg); card.appendChild(hd);

                const row=document.createElement('div'); row.className='wcl-swatches';
                p.colors.forEach(c=>{
                    const sw=document.createElement('div'); sw.className='wcl-sw';
                    if(c.toUpperCase()===baseHex.toUpperCase()) sw.classList.add('base');
                    sw.style.background=c;
                    const tip=document.createElement('span'); tip.className='wcl-tip'; tip.textContent=c.toUpperCase();
                    sw.appendChild(tip);
                    sw.addEventListener('click',e=>{e.stopPropagation();copyHex(c);});
                    row.appendChild(sw);
                }); card.appendChild(row);

                const chips=document.createElement('div'); chips.className='wcl-chips';
                p.colors.forEach(c=>{
                    const ch=document.createElement('span'); ch.className='wcl-chip';
                    ch.textContent=c.toUpperCase();
                    ch.addEventListener('click',e=>{e.stopPropagation();copyHex(c);});
                    chips.appendChild(ch);
                }); card.appendChild(chips);

                card.addEventListener('click',()=>{
                    if(activeCard) activeCard.classList.remove('on');
                    card.classList.add('on'); activeCard=card;
                    preview(paletteToTheme(p.colors));
                });
                grid.appendChild(card);
            });
            area.appendChild(grid);
        }

        // auto-generate default
        genBtn.click();
    })();
    </script>
</body>
